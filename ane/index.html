<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>色鉛筆カラーチェッカー</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6b3c1">

<!-- iPhone -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body{
  margin:0;
  font-family:"Hiragino Maru Gothic ProN",sans-serif;
  background:#fff6ec;
  transition:background .5s;
}

.app{
  max-width:420px;
  margin:auto;
  padding:16px;
}

.header{
  text-align:center;
}

.header h1{
  margin:6px 0;
  color:#d86c8f;
}

.header p{
  margin:0;
  font-size:14px;
  color:#888;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:16px;
  margin-top:18px;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
}

input{ width:100%; }

canvas{
  width:80%;
  display:block;
  margin:12px auto 0;
  border-radius:18px;
}

.result{
  text-align:center;
}

.gage{
  height:18px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.gage div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff8a80,#f06292);
  transition:width .5s;
}

.percent{
  margin-top:6px;
  color:#d86c8f;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>色鉛筆カラーチェッカー</h1>
    <p>色の系統と雰囲気を分析するよ</p>
  </div>

  <div class="card">
    <input type="file" accept="image/*" id="file">
    <canvas id="cv"></canvas>
  </div>

  <div class="card result" id="result" style="display:none">
    <div id="text"></div>
    <div class="gage"><div id="bar"></div></div>
    <div class="percent" id="percent"></div>
  </div>

</div>

<script>
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

/* ===== 画像読み込み ===== */
document.getElementById("file").onchange = e => {
  const img = new Image();
  img.onload = () => {
    cv.width = img.width;
    cv.height = img.height;
    ctx.drawImage(img, 0, 0);
  };
  img.src = URL.createObjectURL(e.target.files[0]);
};

/* ===== キャンバスクリック ===== */
cv.onclick = e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (cv.width / r.width);
  const y = (e.clientY - r.top) * (cv.height / r.height);
  const d = ctx.getImageData(x, y, 1, 1).data;

  document.body.style.background = `rgb(${d[0]},${d[1]},${d[2]})`;
  judge([d[0], d[1], d[2]]);
};

/* ===== 色鉛筆向け分析 ===== */
function analyzeColor([r,g,b]){
  const max = Math.max(r,g,b);
  const min = Math.min(r,g,b);
  const v = max;
  const s = max === 0 ? 0 : (max - min) / max;

  let hue;
  if(s < 0.15) hue = "グレー系";
  else if(max === r && g > b) hue = "オレンジ〜赤";
  else if(max === r) hue = "赤〜ピンク";
  else if(max === g && r > b) hue = "黄緑〜緑";
  else if(max === g) hue = "緑";
  else if(max === b && r > g) hue = "紫〜青";
  else hue = "青";

  let bright =
    v > 220 ? "とても明るい" :
    v > 180 ? "明るい" :
    v > 100 ? "ふつう" : "暗い";

  let vivid =
    s > 0.6 ? "あざやか" :
    s > 0.3 ? "ややくすみ" : "くすみ";

  return {hue, bright, vivid, v, s};
}

/* ===== 表示 ===== */
function judge(rgb){
  const a = analyzeColor(rgb);

  const percent = Math.round((a.s * 0.6 + a.v / 255 * 0.4) * 100);

  document.getElementById("result").style.display = "block";
  document.getElementById("text").innerHTML = `
    ✏️ 色鉛筆向け分析<br>
    <b>${a.hue}</b><br>
    ${a.bright}・${a.vivid}
  `;
  document.getElementById("bar").style.width = percent + "%";
  document.getElementById("percent").textContent =
    `色のはっきり度 ${percent}%`;
}
</script>

</body>
</html>
